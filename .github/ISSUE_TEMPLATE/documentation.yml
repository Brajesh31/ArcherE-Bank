name: "📚 Documentation improvement"
description: Report missing, incorrect or unclear documentation
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: input
    id: location
    attributes:
      label: Document or section
      placeholder: docs/architecture.md
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: What is unclear, missing or incorrect?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested correction
  - type: checkboxes
    id: accuracy
    attributes:
      label: Accuracy
      options:
        - label: I distinguished current behavior from proposed behavior.
          required: true
